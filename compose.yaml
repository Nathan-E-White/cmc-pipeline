name: cmc-pipeline-v3

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: cmc_pipeline
      POSTGRES_USER: cmc
      POSTGRES_PASSWORD: local-development-only
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmc -d cmc_pipeline"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: cmc-local
      MINIO_ROOT_PASSWORD: local-development-only
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: cmc_pipeline
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_USER: cmc
    volumes:
      - ./backend/migrations:/migrations:ro
    command: ["sh", "/migrations/apply.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  electric:
    image: electricsql/electric:1.7.12
    environment:
      DATABASE_URL: postgresql://cmc:local-development-only@postgres:5432/cmc_pipeline
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "3001:3000"

  backend:
    build:
      context: ./backend
    environment:
      CMC_RUN_MIRROR_DSN: postgresql://cmc:local-development-only@postgres:5432/cmc_pipeline
      CMC_ARTIFACT_ENDPOINT: minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3000:80"

  reference-solver:
    build:
      context: .
      dockerfile: containers/solver.Dockerfile
    entrypoint: ["sh", "-c", "sleep infinity"]
    profiles: ["reference"]

volumes:
  postgres-data:
  minio-data:
