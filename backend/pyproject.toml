[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cmc-pipeline-fixture-api"
version = "0.1.0"
description = "Fixture-backed V1 HTTP API for the CMC Fracture Pipeline"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.116,<1.0",
  "minio>=7.2,<8.0",
  "psycopg[binary]>=3.2,<4.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1.0",
  "pytest>=8.0,<9.0",
  "ruff>=0.12,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py314"
